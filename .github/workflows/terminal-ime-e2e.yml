name: Terminal IME E2E

on:
  workflow_dispatch:
  schedule:
    - cron: '30 9 * * *'

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.label }} terminal IME
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: X11
            os: ubuntu-22.04
            display_server: x11
          - label: Wayland
            os: ubuntu-24.04
            display_server: wayland

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install native build and IME tools
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          build-essential
          dbus-x11
          dconf-gsettings-backend
          fcitx5
          fcitx5-chinese-addons
          fcitx5-frontend-gtk3
          fcitx5-hangul
          ibus
          ibus-hangul
          ibus-libpinyin
          libglib2.0-bin
          python3
          sway
          wtype
          xdotool
          xfwm4
          xvfb

      - name: Build native IBus Wayland runtime
        if: matrix.display_server == 'wayland'
        env:
          IBUS_COMMIT: 81ac95ed70b2fe02d41c7735c6788a4c6ab47bcc
          IBUS_SHA256: 7b7e2b9f485387efedb8b60122462a789f9c13f6466b7f033efb7ac523112334
        run: |
          sudo apt-get install -y \
            autoconf automake autopoint gettext gobject-introspection gtk-doc-tools \
            iso-codes libdbus-1-dev libglib2.0-dev libjson-glib-dev libtool \
            libwayland-dev libx11-dev libxkbcommon-dev pkg-config valac wayland-protocols
          curl -fsSL --retry 3 \
            "https://github.com/ibus/ibus/archive/${IBUS_COMMIT}.tar.gz" \
            -o "$RUNNER_TEMP/ibus.tar.gz"
          echo "${IBUS_SHA256}  $RUNNER_TEMP/ibus.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/ibus-source"
          tar -xzf "$RUNNER_TEMP/ibus.tar.gz" --strip-components=1 \
            -C "$RUNNER_TEMP/ibus-source"
          cd "$RUNNER_TEMP/ibus-source"
          autoreconf -fiv
          ./configure \
            --prefix=/usr \
            --enable-shared --disable-static --disable-tests --disable-distro-tests \
            --disable-gtk2 --disable-gtk3 --disable-gtk4 --disable-xim --enable-wayland \
            --disable-appindicator --disable-memconf --disable-dconf \
            --disable-systemd-services --disable-python2 --disable-python-library \
            --disable-setup --disable-dbus-python-check --disable-key-snooper \
            --disable-ui --disable-engine --disable-libnotify --disable-gtk-doc \
            --disable-introspection --disable-vala --disable-emoji-dict \
            --disable-unicode-dict
          cp /usr/share/X11/locale/en_US.UTF-8/Compose src/Compose
          make -C src \
            ibusenumtypes.c ibusenumtypes.h ibusmarshalers.c ibusmarshalers.h \
            ibusresources.c ibusresources.h
          make -C src libibus-1.0.la
          make -C bus marshalers.h marshalers.c
          make -C bus -j2 ibus-daemon
          make -C client/wayland -j2 ibus-wayland
          mkdir "$RUNNER_TEMP/ibus-runtime" "$RUNNER_TEMP/ibus-runtime/lib"
          install -m 0755 bus/.libs/ibus-daemon "$RUNNER_TEMP/ibus-runtime/ibus-daemon"
          install -m 0755 client/wayland/.libs/ibus-wayland \
            "$RUNNER_TEMP/ibus-runtime/ibus-wayland"
          cp -a src/.libs/libibus-1.0.so* "$RUNNER_TEMP/ibus-runtime/lib/"
          echo "ORCA_E2E_IBUS_DAEMON=$RUNNER_TEMP/ibus-runtime/ibus-daemon" >> "$GITHUB_ENV"
          echo "ORCA_E2E_IBUS_WAYLAND=$RUNNER_TEMP/ibus-runtime/ibus-wayland" >> "$GITHUB_ENV"
          echo "ORCA_E2E_IBUS_LIBRARY_PATH=$RUNNER_TEMP/ibus-runtime/lib" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Use external node-gyp to avoid pnpm bundled copy
        run: |
          npm install -g node-gyp@11.5.0
          echo "npm_config_node_gyp=$(npm root -g)/node-gyp/bin/node-gyp.js" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Electron app for E2E
        run: pnpm exec electron-vite build --mode e2e

      - name: Run native IBus exact-byte tests
        if: matrix.display_server == 'x11'
        env:
          ORCA_E2E_NATIVE_IME: ibus
          SKIP_BUILD: '1'
        run: pnpm run test:e2e:terminal-ime-native

      - name: Upload native IBus evidence
        if: ${{ always() && matrix.display_server == 'x11' }}
        uses: actions/upload-artifact@v7
        with:
          name: terminal-ime-native-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Run native Fcitx5 exact-byte tests
        if: matrix.display_server == 'x11'
        env:
          ORCA_E2E_NATIVE_IME: fcitx5
          SKIP_BUILD: '1'
        run: pnpm run test:e2e:terminal-ime-native

      - name: Upload native Fcitx5 evidence
        if: ${{ always() && matrix.display_server == 'x11' }}
        uses: actions/upload-artifact@v7
        with:
          name: terminal-ime-native-fcitx5-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Run native Fcitx5 Wayland exact-byte tests
        if: matrix.display_server == 'wayland'
        env:
          ORCA_E2E_NATIVE_DISPLAY_SERVER: wayland
          ORCA_E2E_NATIVE_IME: fcitx5
          SKIP_BUILD: '1'
        run: pnpm run test:e2e:terminal-ime-native

      - name: Upload native Fcitx5 Wayland evidence
        if: ${{ always() && matrix.display_server == 'wayland' }}
        uses: actions/upload-artifact@v7
        with:
          name: terminal-ime-native-fcitx5-wayland-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Run native IBus Wayland exact-byte tests
        if: matrix.display_server == 'wayland'
        env:
          ORCA_E2E_NATIVE_DISPLAY_SERVER: wayland
          ORCA_E2E_NATIVE_IME: ibus
          SKIP_BUILD: '1'
        run: pnpm run test:e2e:terminal-ime-native

      - name: Upload native IBus Wayland evidence
        if: ${{ always() && matrix.display_server == 'wayland' }}
        uses: actions/upload-artifact@v7
        with:
          name: terminal-ime-native-ibus-wayland-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Run deterministic terminal IME boundary tests
        if: matrix.display_server == 'x11'
        run: >-
          xvfb-run --auto-servernum
          env SKIP_BUILD=1 ORCA_E2E_FORWARD_APP_LOGS=1
          pnpm run test:e2e --
          tests/e2e/terminal-ime-exact-byte.spec.ts
          --workers=1

      - name: Upload terminal IME evidence
        if: ${{ always() && matrix.display_server == 'x11' }}
        uses: actions/upload-artifact@v7
        with:
          name: terminal-ime-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
